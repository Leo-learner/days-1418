<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121110">
<meta name="description" content="1941—1945，苏德战争东线。一个红军排长的战争，和一枚写错了名字的纪念章。文字冒险游戏。">
<title>一千四百一十八天</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="atmo" aria-hidden="true">
  <canvas></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>
<main id="screen" class="screen screen-loading">
  <div class="boot">
    <div class="boot-kicker">ВОСТОЧНЫЙ ФРОНТ · 22.06.1941 — 09.05.1945</div>
    <div class="boot-title">一千四百一十八天</div>
    <div class="boot-note">正在展开卷宗…</div>
  </div>
</main>
<div id="banner" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>
<noscript><p style="padding:24px;color:#E6DFCF">这个游戏需要开启 JavaScript。</p></noscript>
<script type="module" src="src/app.js"></script>
</body>
</html>
