<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Game Hub 游戏库封面（16:9） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F1C17"/><stop offset="1" stop-color="#0E0D0B"/></linearGradient>
    <radialGradient id="glow" cx=".78" cy="1" r=".75"><stop offset="0" stop-color="#6B3A1A" stop-opacity=".45"/><stop offset="1" stop-color="#6B3A1A" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <linearGradient id="pp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0E6CC"/><stop offset="1" stop-color="#D9C9A4"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <text x="1300" y="700" text-anchor="end" font-size="400" font-weight="700" fill="#E6DFCF" fill-opacity=".035" font-family="'American Typewriter', 'Courier New', Courier, monospace">1418</text>
  <g fill="#ffffff">
    <circle cx="140" cy="90" r="1.6" opacity=".45"/><circle cx="310" cy="160" r="1.2" opacity=".35"/><circle cx="520" cy="70" r="2" opacity=".4"/>
    <circle cx="690" cy="210" r="1.3" opacity=".3"/><circle cx="880" cy="110" r="1.8" opacity=".4"/><circle cx="1040" cy="60" r="1.4" opacity=".35"/>
    <circle cx="1210" cy="180" r="2.1" opacity=".4"/><circle cx="60" cy="400" r="1.5" opacity=".3"/><circle cx="420" cy="620" r="1.7" opacity=".35"/>
    <circle cx="760" cy="660" r="1.2" opacity=".3"/><circle cx="600" cy="420" r="1.4" opacity=".25"/><circle cx="230" cy="690" r="2" opacity=".35"/>
  </g>

  <g font-family="'Songti SC', 'STSong', 'Noto Serif SC', 'Noto Serif CJK SC', 'Source Han Serif SC', SimSun, serif">
    <text x="96" y="222" font-size="20" letter-spacing="6" fill="#6F695C" font-family="'American Typewriter', 'Courier New', Courier, monospace">ВОСТОЧНЫЙ ФРОНТ · 1941—1945</text>
    <text x="92" y="330" font-size="84" font-weight="900" fill="#E6DFCF">一千四百一十八天</text>
    <rect x="96" y="378" width="70" height="4" fill="#B8322A"/>
    <text x="186" y="391" font-size="30" font-weight="700" fill="#A69E8C" letter-spacing="10">东线档案</text>
    <text x="96" y="476" font-size="25" fill="#A69E8C">一个红军排长的战争，</text>
    <text x="96" y="516" font-size="25" fill="#A69E8C">和一枚写错了名字的纪念章。</text>
  </g>

  <g transform="translate(1008 300) rotate(-7)" filter="url(#sh)">
    <rect x="-200" y="-132" width="400" height="264" rx="6" fill="url(#pp)"/>
    <g fill="#2A241C" font-family="'American Typewriter', 'Courier New', Courier, monospace">
      <text x="-168" y="-68" font-size="34" font-weight="700" xml:space="preserve">ГРОМОВ  И. С.</text>
      <text x="-168" y="-24" font-size="25">1920 · г. КАЗАНЬ</text>
    </g>
    <rect x="-168" y="4" width="290" height="2.5" fill="#2A241C" fill-opacity=".5"/>
    <rect x="-168" y="20" width="228" height="2.5" fill="#2A241C" fill-opacity=".35"/>
    <rect x="-168" y="36" width="262" height="2.5" fill="#2A241C" fill-opacity=".35"/>
  </g>
  <g transform="translate(1110 470) rotate(14)" opacity=".93" fill="none" stroke="#C0281E">
    <circle r="100" stroke-width="10"/>
    <circle r="84" stroke-width="3.5"/>
    <text y="23" text-anchor="middle" font-size="66" font-weight="700" fill="#C0281E" stroke="none" font-family="'American Typewriter', 'Courier New', Courier, monospace">1418</text>
  </g>
  <rect width="1280" height="720" fill="url(#vig)"/>
</svg>
